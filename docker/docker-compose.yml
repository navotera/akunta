name: akunta

services:
  redis_akunta:
    image: redis:7-alpine
    container_name: redis_akunta
    volumes:
      - redis_data_akunta:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  accounting:
    build:
      context: ..
      dockerfile: docker/php-fpm/Dockerfile
      args:
        APP_PATH: apps/accounting
    working_dir: /var/www/html/apps/accounting
    env_file: ../apps/accounting/.env
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      LOG_LEVEL: ${LOG_LEVEL:-warning}
      PHP_OPCACHE_ENABLE: ${PHP_OPCACHE_ENABLE:-1}
      REDIS_HOST: redis_akunta
    volumes:
      - accounting_storage:/var/www/html/apps/accounting/storage
    depends_on:
      redis_akunta:
        condition: service_healthy
    networks:
      - default
      - postgres_db
    ports:
      - "${ACCOUNTING_PORT:-8000}:8080"
    restart: unless-stopped

  accounting-web:
    build:
      context: ..
      dockerfile: docker/accounting-web/Dockerfile
    depends_on:
      accounting:
        condition: service_healthy
    ports:
      - "${ACCOUNTING_WEB_PORT:-5173}:80"
    restart: unless-stopped

volumes:
  redis_data_akunta:
  accounting_storage:

networks:
  default:
    name: akunta_default
  postgres_db:
    external: true
    name: homeopensynergic_default
